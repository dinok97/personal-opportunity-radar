[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-opportunity-radar-backend"
version = "0.1.0"
description = "Backend API for the Personal Opportunity Radar career assistant"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langchain-ollama>=0.3,<1.0",
  "langchain-postgres>=0.0.18,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pypdf>=5.0,<7.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
